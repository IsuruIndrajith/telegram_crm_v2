---
deployment:
  tasks:
    # Install / update Python dependencies into the venv cPanel created
    - export DEPLOYPATH=/home/forey/nexora_crm
    - /home/forey/virtualenv/nexora_crm/3.11/bin/pip install -r $DEPLOYPATH/requirements.txt --quiet

    # Create runtime directories that are gitignored
    - mkdir -p $DEPLOYPATH/uploads
    - mkdir -p $DEPLOYPATH/sessions
    - mkdir -p $DEPLOYPATH/tmp

    # Tell Passenger to restart the app
    - touch $DEPLOYPATH/tmp/restart.txt
