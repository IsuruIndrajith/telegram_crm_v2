<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if first_run %}Create Super Admin{% else %}Login{% endif %} — Nexora Pips CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .login-card {
      background: #fff; border-radius: 16px; padding: 2.4rem 2rem;
      width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .brand-logo { font-size: 1.5rem; font-weight: 800; color: #0f172a; }
    .brand-logo span { color: #0d6efd; }
    .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 .2rem rgba(13,110,253,.15); }
    .btn-login { background: #0d6efd; border: none; padding: .65rem; font-weight: 600; }
    .btn-login:hover { background: #0b5ed7; }
    .first-run-badge {
      background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
      padding: .6rem .9rem; font-size: .82rem; color: #856404; margin-bottom: 1.2rem;
    }
  </style>
</head>
<body>
<div class="login-card">
  <div class="text-center mb-3">
    <div class="brand-logo"><i class="bi bi-send-fill text-primary me-1"></i>Nexora<span>Pips</span></div>
    <small class="text-muted">Telegram CRM v2</small>
  </div>

  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
      <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  {% if first_run %}
  <div class="first-run-badge">
    <i class="bi bi-stars me-1"></i>
    <strong>First-time setup</strong> — create your super-admin account below.
  </div>
  <form method="POST" action="{{ url_for('login') }}">
    <input type="hidden" name="action" value="create_superadmin">
    <div class="mb-3">
      <label class="form-label small fw-semibold">Username</label>
      <input type="text" name="username" class="form-control" placeholder="superadmin" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Choose a strong password" required>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Confirm Password</label>
      <input type="password" name="confirm" class="form-control" placeholder="Repeat password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-login w-100">
      <i class="bi bi-person-check me-1"></i>Create Super Admin
    </button>
  </form>

  {% else %}
  <form method="POST" action="{{ url_for('login') }}">
    <input type="hidden" name="action" value="login">
    <div class="mb-3">
      <label class="form-label small fw-semibold">Username</label>
      <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-login w-100">
      <i class="bi bi-box-arrow-in-right me-1"></i>Login
    </button>
  </form>
  {% endif %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
